# Contoh vhost nginx untuk Artesis (SaaS POS Optik).
# Sesuaikan: server_name, root, fastcgi_pass (socket PHP-FPM Anda),
# dan jalur sertifikat TLS. Prinsip header di blok ini adalah bagian
# dari gerbang go-live — jangan dihapus.
server {
    listen 80;
    server_name artesis.contoh.id;
    # Arahkan semua HTTP ke HTTPS (setelah sertifikat aktif).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name artesis.contoh.id;

    server_tokens off;

    root /var/www/artesis/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/artesis.contoh.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artesis.contoh.id/privkey.pem;

    # Header keamanan (gerbang go-live — lihat docs/DEPLOY-RUNBOOK.md).
    # HSTS TANPA includeSubDomains sampai semua subdomain siap HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
